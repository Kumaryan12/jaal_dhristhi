[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jaaldrishti-backend"
version = "0.1.0"
description = "Explainable lending ecosystem risk intelligence"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "networkx>=3.4,<4",
  "numpy>=2.0,<3",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
ml-xgboost = ["xgboost>=3.0,<4"]

[project.scripts]
jaal-generate-data = "app.services.synthetic_data.cli:main"
jaal-resolve-entities = "app.services.entity_resolution.cli:main"
jaal-analyze-graph = "app.services.graph_intelligence.cli:main"
jaal-analyze-temporal = "app.services.temporal_intelligence.cli:main"
jaal-score-risk = "app.services.risk_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
