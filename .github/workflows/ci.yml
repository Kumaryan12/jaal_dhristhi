name: release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend
        run: python -m pip install -e 'backend[ml-xgboost,test]' ruff
      - name: Lint
        run: PYTHONPATH=backend ruff check backend tests
      - name: Compile
        run: PYTHONPATH=backend python -m compileall -q backend/app tests
      - name: Test
        run: PYTHONPATH=backend python -W error::ResourceWarning -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
